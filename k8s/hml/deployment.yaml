apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-jenkins
  namespace: fast-api-hml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-api-jenkins
  template:
    metadata:
      labels:
        app: fast-api-jenkins
    spec:
      containers:
        - name: api
          image: fast-api-jenkins:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
