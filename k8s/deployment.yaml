apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-api-jenkins
  template:
    metadata:
      labels:
        app: fast-api-jenkins
    spec:
      containers:
        - name: api
          image: fast-api-jenkins:latest
          ports:
            - containerPort: 8000
